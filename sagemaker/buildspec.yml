version: 0.2

# Native x86-64 build of a training image on AWS CodeBuild, then push to ECR. CodeBuild
# runs on a real amd64 Linux worker, so there is no QEMU emulation and git-lfs pulls the
# Geneformer weights without crashing (unlike a cross-build on an Apple-silicon host).
#
# Every build pushes a UNIQUE tag (b<build number>) and prints the image's digest, which
# is what jobs should run (launch.py pins a tag to its digest anyway). The image is first
# pushed under a staging tag (gate-b<N>) so ECR can scan it, and only gets its b<N> tag, which
# is what the launcher's default looks for, after the scan gate in sagemaker/post_build.py
# has passed. A build that fails the gate leaves a gate-b<N> image and no b<N> tag. The repository is
# created with immutable tags and scan-on-push if it does not exist; for one that already
# exists, set both once (docs/security/aws-baseline.md). The mutable IMAGE_TAG (e.g.
# `latest`) is still pushed, for compatibility, only while the repository is MUTABLE: an
# immutable repository rejects re-pushing a tag, so there it is skipped.
#
# Required env vars (set on the CodeBuild project):
#   AWS_ACCOUNT_ID, AWS_DEFAULT_REGION, IMAGE_REPO_NAME (e.g. geneformer-ft)
# Optional:
#   BACKEND (geneformer | scgpt; default geneformer) selects the Dockerfile and,
#     when IMAGE_REPO_NAME is unset-per-backend, the conventional repo name.
#   IMAGE_TAG (e.g. latest): also pushed, but only to a MUTABLE repository.
#   SCAN_FAIL_ON (e.g. CRITICAL or CRITICAL,HIGH): fail the build when the ECR scan finds
#     that severity, or when no scan result arrives in time. Unset = report only
#     (see sagemaker/post_build.py).
#   SCAN_TIMEOUT (seconds, default 1200): how long to wait for the ECR scan.
# The project must run with privilegedMode=true (Docker-in-Docker) unless it uses the
# CodeBuild Docker server, and a service role like docs/iam/codebuild-service-role-policy.json.

phases:
  pre_build:
    commands:
      - BACKEND="${BACKEND:-geneformer}"
      - 'if [ "$BACKEND" = "scgpt" ]; then DOCKERFILE=sagemaker/Dockerfile.scgpt; DEFAULT_REPO=scgpt-ft; else DOCKERFILE=sagemaker/Dockerfile; DEFAULT_REPO=geneformer-ft; fi'
      - IMAGE_REPO_NAME="${IMAGE_REPO_NAME:-$DEFAULT_REPO}"
      - BUILD_TAG="b${CODEBUILD_BUILD_NUMBER:-0}"
      - STAGING_TAG="gate-${BUILD_TAG}"
      - echo "Backend=$BACKEND Dockerfile=$DOCKERFILE Repo=$IMAGE_REPO_NAME Tag=$BUILD_TAG"
      - ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_URI"
      - aws ecr describe-repositories --repository-names "$IMAGE_REPO_NAME" --region "$AWS_DEFAULT_REGION" >/dev/null 2>&1 || aws ecr create-repository --repository-name "$IMAGE_REPO_NAME" --region "$AWS_DEFAULT_REGION" --image-tag-mutability IMMUTABLE --image-scanning-configuration scanOnPush=true
      - REPO_MUTABILITY=$(aws ecr describe-repositories --repository-names "$IMAGE_REPO_NAME" --region "$AWS_DEFAULT_REGION" --query 'repositories[0].imageTagMutability' --output text)
      - echo "Repository tag mutability=$REPO_MUTABILITY"
  build:
    commands:
      - echo "Building image $IMAGE_REPO_NAME:$BUILD_TAG (native amd64, $DOCKERFILE)..."
      - docker build -f "$DOCKERFILE" -t "$IMAGE_REPO_NAME:$BUILD_TAG" .
      - docker tag "$IMAGE_REPO_NAME:$BUILD_TAG" "$ECR_URI/$IMAGE_REPO_NAME:$STAGING_TAG"
  post_build:
    commands:
      # post_build also runs when the build failed; do not push or report a half-built image.
      - '[ "${CODEBUILD_BUILD_SUCCEEDING:-1}" = "1" ] || { echo "Build failed; nothing to push."; exit 1; }'
      - echo "Pushing to $ECR_URI/$IMAGE_REPO_NAME:$STAGING_TAG; it gets $BUILD_TAG only if the scan gate passes ..."
      - docker push "$ECR_URI/$IMAGE_REPO_NAME:$STAGING_TAG"
      - IMAGE_DIGEST_URI=$(docker inspect --format '{{index .RepoDigests 0}}' "$ECR_URI/$IMAGE_REPO_NAME:$STAGING_TAG")
      - python3 sagemaker/post_build.py --repository "$IMAGE_REPO_NAME" --tag "$BUILD_TAG" --image "$IMAGE_DIGEST_URI" --backend "$BACKEND" --dockerfile "$DOCKERFILE" --lock uv.lock --lock sagemaker/requirements-scgpt.txt --lock sagemaker/requirements-scgpt-build.txt --lock sagemaker/requirements-scgpt-flashattn.txt --lock sagemaker/requirements-bootstrap.txt --lock sagemaker/requirements-toolkit.txt --lock sagemaker/requirements-toolkit-build.txt
      - echo "Scan step finished (it fails the build only when SCAN_FAIL_ON is set); tagging $BUILD_TAG ..."
      - docker tag "$ECR_URI/$IMAGE_REPO_NAME:$STAGING_TAG" "$ECR_URI/$IMAGE_REPO_NAME:$BUILD_TAG"
      - docker push "$ECR_URI/$IMAGE_REPO_NAME:$BUILD_TAG"
      - 'if [ "$REPO_MUTABILITY" = "MUTABLE" ] && [ -n "${IMAGE_TAG:-}" ]; then docker tag "$ECR_URI/$IMAGE_REPO_NAME:$BUILD_TAG" "$ECR_URI/$IMAGE_REPO_NAME:$IMAGE_TAG" && docker push "$ECR_URI/$IMAGE_REPO_NAME:$IMAGE_TAG"; else echo "Not pushing a moving tag (repository is $REPO_MUTABILITY)."; fi'
      - echo "Done. Run this image by digest = $IMAGE_DIGEST_URI"
